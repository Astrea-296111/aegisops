[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisops"
version = "0.1.0"
description = "Evidence-grounded incident investigations with durable execution and bounded authority"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "sqlalchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.20,<1", "asyncpg>=0.30,<1", "httpx>=0.28,<1",
  "alembic>=1.14,<2", "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2", "prometheus-client>=0.21,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "mypy>=1.14,<3", "build>=1.2,<2", "pyyaml>=6,<7"]
[project.scripts]
aegisops = "aegisops.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
aegisops = ["data/scenarios/*.json"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["postgres: requires TEST_POSTGRES_URL"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

